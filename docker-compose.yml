services:

  # PostgreSQL Database for Zabbix Server
  postgresql:
    image: postgres:16.14-alpine
    container_name: zabbix-postgresql
    restart: unless-stopped # 항상 실행되도록 설정
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: # PostgreSQL 데이터 영속성을 위한 볼륨 마운트
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zabbix Server
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0.27
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgresql
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ZBX_SERVER_NAME: ${ZBX_SERVER_NAME}
      ZBX_WEBDRIVERURL: http://selenium-chrome:4444
      ZBX_STARTBROWSERPOLLERS: 2
      TZ: ${PHP_TZ}
    depends_on:
      postgresql:
        condition: service_healthy
      selenium-chrome:
        condition: service_started
    expose:
      - "10051"
    networks:
      - zabbix-net

  # Selenium WebDriver endpoint for Zabbix Browser Items
  selenium-chrome:
    image: selenium/standalone-chrome:4.21.0
    container_name: selenium-chrome
    restart: unless-stopped
    shm_size: "2gb"
    expose:
      - "4444"
    networks:
      - zabbix-net

  # Zabbix Web Interface
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0.27
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: ${ZBX_SERVER_HOST}
      DB_SERVER_HOST: postgresql
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ZBX_SERVER_NAME: ${ZBX_SERVER_NAME}
      PHP_TZ: ${PHP_TZ}
    depends_on:
      - zabbix-server
    ports:
      - "8080:8080"
    networks:
      - zabbix-net

  # Zabbix Agent 2
  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0.27
    container_name: zabbix-agent2
    hostname: zabbix-agent2
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: Zabbix server
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
    depends_on:
      - zabbix-server
    networks:
      - zabbix-net

  # Zabbix Agent 2 sidecar for nginx process/script monitoring
  nginx-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0.27
    container_name: nginx-agent2
    hostname: nginx-agent2
    restart: unless-stopped
    pid: "container:nginx-sample"
    environment:
      ZBX_HOSTNAME: nginx-sample
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_ALLOWKEY: system.run[sh /var/lib/zabbix/user_scripts/nginx_process_count.sh],system.run[sh /var/lib/zabbix/user_scripts/nginx_active_connections.sh],system.run[sh /var/lib/zabbix/user_scripts/nginx_total_requests.sh]
    volumes:
      - ./zabbix/agent2/scripts:/var/lib/zabbix/user_scripts:ro
    depends_on:
      - zabbix-server
      - nginx
    networks:
      - zabbix-net

  # Nginx Web Server to be monitored
  nginx:
    image: nginx:1.27.5-alpine
    container_name: nginx-sample
    expose:
      - "80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Zabbix 구성 요소들이 통신할 수 있는 전용 네트워크
  zabbix-net:
    driver: bridge

volumes:
  # PostgreSQL 볼륨
  postgres-data:

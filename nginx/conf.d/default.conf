server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        default_type text/plain;
        return 200 "Welcome to nginx\n";
    }

    location /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    location /status {
        default_type text/plain;
        return 200 "status check\n";
    }
}